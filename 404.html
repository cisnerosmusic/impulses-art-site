<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | IMPULSES.ART</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:wght@300;400&family=Space+Mono&display=swap">
<style>

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cormorant Garamond', serif;
    background: #0a0c1f;
    color: #e8e4dc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated background particles */
  canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    max-width: 600px;
  }

  .error-code {
    font-family: 'Cinzel', serif;
    font-size: clamp(6rem, 20vw, 12rem);
    font-weight: 400;
    letter-spacing: 0.15em;
    color: rgba(212, 160, 48, 0.12);
    line-height: 1;
    margin-bottom: 0.5rem;
    position: relative;
  }

  .error-code::after {
    content: '404';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #d4a030 0%, rgba(212, 160, 48, 0.3) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: pulse 4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .divider {
    width: 60px;
    height: 2px;
    background: #d4a030;
    margin: 1.5rem auto;
  }

  .message {
    font-size: 1.3rem;
    font-weight: 300;
    color: rgba(200, 195, 185, 0.7);
    margin-bottom: 0.75rem;
    letter-spacing: 0.02em;
  }

  .submessage {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: rgba(180, 170, 155, 0.4);
    margin-bottom: 2.5rem;
    letter-spacing: 0.05em;
  }

  .home-link {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: #d4a030;
    text-decoration: none;
    padding: 0.9rem 2.5rem;
    border: 1px solid rgba(212, 160, 48, 0.3);
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
  }

  .home-link::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(212, 160, 48, 0.08);
    transform: translateX(-100%);
    transition: transform 0.4s ease;
  }

  .home-link:hover {
    color: #f0c860;
    border-color: rgba(212, 160, 48, 0.6);
    box-shadow: 0 0 30px rgba(212, 160, 48, 0.1);
  }

  .home-link:hover::before {
    transform: translateX(0);
  }

  .logo {
    position: fixed;
    top: 2rem;
    left: 2rem;
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    color: rgba(212, 160, 48, 0.5);
    text-decoration: none;
    z-index: 2;
    transition: color 0.3s;
  }

  .logo:hover { color: #d4a030; }
</style>
<style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
</head>
<body>
<main id="main">

<canvas id="particles"></canvas>

<a href="/" class="logo">IMPULSES.ART</a>

<h1 class="sr-only">404: page not found</h1>
<div class="container">
  <div class="error-code">404</div>
  <div class="divider"></div>
  <p class="message">This page does not exist.</p>
  <p class="submessage">The silence between notes is also music.</p>
  <a href="/" class="home-link">Return Home</a>
</div>

</main>
<script>
(function () {
  var canvas = document.getElementById('particles');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var count = 60;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function create() {
    particles = [];
    for (var i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.5,
        dx: (Math.random() - 0.5) * 0.3,
        dy: (Math.random() - 0.5) * 0.3,
        o: Math.random() * 0.3 + 0.05
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(212, 160, 48, ' + p.o + ')';
      ctx.fill();
      p.x += p.dx;
      p.y += p.dy;
      if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
      if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
    }
    // Draw faint connections
    for (var i = 0; i < particles.length; i++) {
      for (var j = i + 1; j < particles.length; j++) {
        var dx = particles[i].x - particles[j].x;
        var dy = particles[i].y - particles[j].y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = 'rgba(212, 160, 48, ' + (0.03 * (1 - dist / 120)) + ')';
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }

  resize();
  create();
  draw();
  window.addEventListener('resize', function () { resize(); create(); });
})();
</script>

</body>
</html>
