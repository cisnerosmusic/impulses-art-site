<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Space+Mono&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0c1f;
  --gold: #d4a030;
  --gold-bright: #f0c860;
  --gold-dim: rgba(212, 160, 48, 0.5);
  --text: #e8e4dc;
  --text-dim: rgba(200, 195, 185, 0.5);
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  cursor: default;
  user-select: none;
  -webkit-user-select: none;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* ── Logo ── */
.logo {
  position: fixed;
  top: 1.5rem;
  left: 1.5rem;
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  letter-spacing: 0.3em;
  color: rgba(212, 160, 48, 0.4);
  text-decoration: none;
  z-index: 10;
  transition: color 0.4s;
}
.logo:hover { color: var(--gold); }

/* ── Home link ── */
.home-link {
  position: fixed;
  top: 1.5rem;
  right: 1.5rem;
  font-family: 'Cinzel', serif;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: rgba(200, 195, 185, 0.3);
  text-decoration: none;
  z-index: 10;
  transition: color 0.4s;
}
.home-link:hover { color: var(--text-dim); }

/* ── Controls ── */
.controls {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 2.5rem;
}

.play-btn {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 1px solid rgba(212, 160, 48, 0.25);
  background: rgba(10, 12, 31, 0.6);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.4s ease;
  position: relative;
}

.play-btn:hover {
  border-color: var(--gold-dim);
  box-shadow: 0 0 40px rgba(212, 160, 48, 0.1);
}

.play-btn svg {
  fill: var(--gold-dim);
  transition: fill 0.3s;
  width: 20px;
  height: 20px;
}

.play-btn:hover svg { fill: var(--gold); }

.play-icon { display: block; }
.pause-icon { display: none; }
.playing .play-icon { display: none; }
.playing .pause-icon { display: block; }

/* ── Volume ── */
.volume-wrap {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-top: 1.2rem;
  opacity: 0.35;
  transition: opacity 0.4s;
}
.volume-wrap:hover { opacity: 0.7; }

.volume-wrap svg {
  width: 14px;
  height: 14px;
  fill: var(--gold-dim);
  flex-shrink: 0;
}

.volume-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 80px;
  height: 1px;
  background: rgba(212, 160, 48, 0.25);
  outline: none;
  border-radius: 1px;
}

.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--gold-dim);
  cursor: pointer;
  transition: background 0.3s;
}

.volume-slider::-moz-range-thumb {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--gold-dim);
  border: none;
  cursor: pointer;
}

/* ── Invitation text ── */
.invitation {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 5;
  text-align: center;
  pointer-events: none;
  transition: opacity 1.5s ease;
}

.invitation h2 {
  font-family: 'Cinzel', serif;
  font-weight: 400;
  font-size: clamp(1.2rem, 3vw, 1.8rem);
  letter-spacing: 0.15em;
  color: rgba(212, 160, 48, 0.6);
  margin-bottom: 1rem;
}

.invitation p {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(0.9rem, 2vw, 1.1rem);
  color: var(--text-dim);
  letter-spacing: 0.04em;
}

.invitation.hidden { opacity: 0; }

/* ── Progress line ── */
.progress-line {
  position: fixed;
  bottom: 0;
  left: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  z-index: 11;
  transition: width 0.3s linear;
  width: 0%;
}

@media (max-width: 600px) {
  .play-btn { width: 56px; height: 56px; }
  .controls { padding-bottom: 2rem; }
  .logo { font-size: 0.6rem; top: 1rem; left: 1rem; }
  .home-link { top: 1rem; right: 1rem; font-size: 0.6rem; }
}
</style>
</head>
<body>

<canvas id="viz"></canvas>

<a href="/" class="logo">IMPULSES.ART</a>
<a href="/" class="home-link">HOME</a>

<div class="invitation" id="invitation">
  <h2>Listen</h2>
  <p>Close your eyes. Let the music hold the space.</p>
</div>

<div class="controls">
  <button class="play-btn" id="playBtn" aria-label="Play">
    <svg class="play-icon" viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
    <svg class="pause-icon" viewBox="0 0 24 24"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
  </button>
  <div class="volume-wrap">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8.5v7a4.47 4.47 0 002.5-3.5z"/></svg>
    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
  </div>
</div>

<div class="progress-line" id="progressLine"></div>

<script>
(function () {
  // ── Audio Engine ──
  var tracks = [];
  for (var i = 1; i <= 17; i++) tracks.push('assets/audio/' + i + '.mp3');

  var currentIndex = 0;
  var audio = new Audio();
  audio.crossOrigin = 'anonymous';
  audio.volume = 0.7;
  audio.preload = 'auto';

  var audioCtx, analyser, dataArray, source, connected = false;
  var isPlaying = false;
  var sampleRate = 44100;

  // Frequency band indices (computed after audioCtx init)
  var lowStart, lowEnd, highStart, highEnd;

  function initAudioContext() {
    if (connected) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sampleRate = audioCtx.sampleRate;
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;  // 512 bins → ~86Hz per bin at 44.1kHz
    analyser.smoothingTimeConstant = 0.82;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    connected = true;

    // Calculate bin ranges
    var binHz = sampleRate / analyser.fftSize;
    lowStart = Math.floor(40 / binHz);     // ~40 Hz
    lowEnd = Math.ceil(450 / binHz);       // ~450 Hz
    highStart = Math.floor(2000 / binHz);  // ~2 kHz
    highEnd = Math.ceil(10000 / binHz);    // ~10 kHz
  }

  function loadTrack(index) {
    currentIndex = index % tracks.length;
    audio.src = tracks[currentIndex];
  }

  function play() {
    initAudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    audio.play();
    isPlaying = true;
    playBtn.classList.add('playing');
    // Fade out invitation
    setTimeout(function () {
      invitation.classList.add('hidden');
    }, 2000);
  }

  function pause() {
    audio.pause();
    isPlaying = false;
    playBtn.classList.remove('playing');
  }

  audio.addEventListener('ended', function () {
    // Crossfade: load next and play
    loadTrack(currentIndex + 1);
    audio.play();
  });

  // Shuffle on first load
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  shuffle(tracks);
  loadTrack(0);

  // ── Controls ──
  var playBtn = document.getElementById('playBtn');
  var volumeSlider = document.getElementById('volumeSlider');
  var invitation = document.getElementById('invitation');
  var progressLine = document.getElementById('progressLine');

  playBtn.addEventListener('click', function () {
    if (isPlaying) pause(); else play();
  });

  volumeSlider.addEventListener('input', function () {
    audio.volume = parseFloat(this.value);
  });

  // Progress
  setInterval(function () {
    if (audio.duration && isPlaying) {
      var pct = (audio.currentTime / audio.duration) * 100;
      progressLine.style.width = pct + '%';
    }
  }, 200);

  // ── Visualization ──
  var canvas = document.getElementById('viz');
  var ctx = canvas.getContext('2d');
  var W, H, cx, cy;
  var particles = [];
  var NUM_PARTICLES = 120;
  var orbRings = [];
  var NUM_RINGS = 5;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W / 2;
    cy = H / 2;
  }

  // Particle class
  function Particle() {
    this.reset();
  }

  Particle.prototype.reset = function () {
    var angle = Math.random() * Math.PI * 2;
    var dist = 80 + Math.random() * Math.min(W, H) * 0.35;
    this.x = cx + Math.cos(angle) * dist;
    this.y = cy + Math.sin(angle) * dist;
    this.baseX = this.x;
    this.baseY = this.y;
    this.angle = angle;
    this.dist = dist;
    this.speed = 0.0003 + Math.random() * 0.0008;
    this.r = 0.5 + Math.random() * 1.5;
    this.opacity = 0.1 + Math.random() * 0.3;
    this.phase = Math.random() * Math.PI * 2;
  };

  Particle.prototype.update = function (t, energy) {
    this.angle += this.speed * (1 + energy * 2);
    var breathe = 1 + Math.sin(t * 0.001 + this.phase) * 0.1;
    var energyPush = 1 + energy * 0.4;
    var d = this.dist * breathe * energyPush;
    this.x = cx + Math.cos(this.angle) * d;
    this.y = cy + Math.sin(this.angle) * d;
  };

  Particle.prototype.draw = function (energy) {
    var o = this.opacity * (0.6 + energy * 0.8);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * (1 + energy * 0.5), 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(212, 160, 48, ' + o + ')';
    ctx.fill();
  };

  // Orb ring
  function OrbRing(index) {
    this.baseRadius = 30 + index * 25;
    this.width = 1;
    this.phase = index * 0.7;
    this.speed = 0.0008 + index * 0.0002;
  }

  OrbRing.prototype.draw = function (t, energy) {
    var breathe = Math.sin(t * this.speed + this.phase);
    var r = this.baseRadius * (1 + breathe * 0.15 + energy * 0.3);
    var o = 0.04 + energy * 0.12 + breathe * 0.02;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(212, 160, 48, ' + Math.max(0, o) + ')';
    ctx.lineWidth = this.width + energy * 1.5;
    ctx.stroke();
  };

  // Init
  function init() {
    resize();
    particles = [];
    for (var i = 0; i < NUM_PARTICLES; i++) {
      particles.push(new Particle());
    }
    orbRings = [];
    for (var j = 0; j < NUM_RINGS; j++) {
      orbRings.push(new OrbRing(j));
    }
  }

  // Draw connections between nearby particles
  function drawConnections(energy) {
    var maxDist = 100 + energy * 60;
    for (var i = 0; i < particles.length; i++) {
      for (var j = i + 1; j < particles.length; j++) {
        var dx = particles[i].x - particles[j].x;
        var dy = particles[i].y - particles[j].y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < maxDist) {
          var o = (1 - dist / maxDist) * 0.06 * (1 + energy * 3);
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = 'rgba(212, 160, 48, ' + o + ')';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
  }

  // Central glow
  function drawGlow(energy) {
    var r = 60 + energy * 80;
    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, 'rgba(212, 160, 48, ' + (0.06 + energy * 0.12) + ')');
    grad.addColorStop(0.5, 'rgba(212, 160, 48, ' + (0.02 + energy * 0.04) + ')');
    grad.addColorStop(1, 'rgba(212, 160, 48, 0)');
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
  }

  // Flowing tendrils
  function drawTendrils(t, energy) {
    var numTendrils = 6;
    for (var i = 0; i < numTendrils; i++) {
      var baseAngle = (Math.PI * 2 / numTendrils) * i + t * 0.0001;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      var segments = 40;
      for (var s = 1; s <= segments; s++) {
        var frac = s / segments;
        var dist = frac * (120 + energy * 100);
        var wobble = Math.sin(t * 0.002 + i * 1.2 + frac * 4) * 0.3 * frac;
        var angle = baseAngle + wobble;
        var px = cx + Math.cos(angle) * dist;
        var py = cy + Math.sin(angle) * dist;
        ctx.lineTo(px, py);
      }
      var o = 0.03 + energy * 0.06;
      ctx.strokeStyle = 'rgba(212, 160, 48, ' + o + ')';
      ctx.lineWidth = 1 + energy;
      ctx.stroke();
    }
  }

  // ── Main Loop ──
  var lastTime = 0;

  function animate(t) {
    requestAnimationFrame(animate);

    ctx.fillStyle = 'rgba(10, 12, 31, 0.15)';
    ctx.fillRect(0, 0, W, H);

    // Get frequency-separated energy
    var eLow = 0, eHigh = 0;
    if (analyser && isPlaying) {
      analyser.getByteFrequencyData(dataArray);

      // Low band: 40–450 Hz → rings, glow, tendrils (body of piano)
      var sumLow = 0, countLow = 0;
      for (var i = lowStart; i <= lowEnd && i < dataArray.length; i++) {
        sumLow += dataArray[i]; countLow++;
      }
      eLow = countLow > 0 ? (sumLow / countLow) / 255 : 0;

      // High band: 2–10 kHz → particles, connections (attack, harmonics)
      var sumHigh = 0, countHigh = 0;
      for (var i = highStart; i <= highEnd && i < dataArray.length; i++) {
        sumHigh += dataArray[i]; countHigh++;
      }
      eHigh = countHigh > 0 ? (sumHigh / countHigh) / 255 : 0;
    }

    // Ambient animation when not playing
    var ambLow = Math.sin(t * 0.0004) * 0.05 + 0.06;
    var ambHigh = Math.sin(t * 0.0007 + 1.5) * 0.04 + 0.04;
    var low = Math.max(eLow, ambLow);
    var high = Math.max(eHigh, ambHigh);

    // Draw layers — low frequencies drive rings/glow/tendrils
    drawGlow(low);
    drawTendrils(t, low);

    for (var r = 0; r < orbRings.length; r++) {
      orbRings[r].draw(t, low);
    }

    // High frequencies drive particles and connections
    for (var p = 0; p < particles.length; p++) {
      particles[p].update(t, high);
      particles[p].draw(high);
    }

    drawConnections(high);
  }

  // ── Start ──
  init();
  requestAnimationFrame(animate);
  window.addEventListener('resize', function () {
    resize();
    cx = W / 2;
    cy = H / 2;
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      if (isPlaying) pause(); else play();
    }
  });
})();
</script>

<script src="assets/js/schema-shared.js" defer></script>
<script data-goatcounter="https://ernestocisnerosart.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
